[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "english_learing"
version = "0.1.0"
readme = "readme.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "requests>=2.31",
]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true          # 子包不带 __init__.py (PEP 420), 打包时按命名空间包识别